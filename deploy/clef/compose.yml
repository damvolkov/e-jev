services:

  clef:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: clef
    hostname: clef
    restart: unless-stopped
    ipc: host
    labels:
      e-core.category: "ai"
      e-core.port: "45164"
    ports:
      # 45164 — Clef-Flash decision model (ai)
      - "${CLEF_PORT:-45164}:8080"
    volumes:
      - ../data/clef/models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    # Clef-Flash Q4_K_M: one forward, joint schema head. The head scores every option in ONE batch, so
    # `-ub` must be at least the whole prompt (state + questions): 4096 answers typed-decision questions
    # up to ~4k tokens (noul p50 38 ms); invoice-scale states (24k+) need `-ub` ≥ prompt and `-c` ≥ 49k,
    # which costs 18 GB and stops fitting beside vLLM — long context stays with the reader. Measured
    # 2026-10-14: 6.9 GB at 32k, 17.7 GB at 49k/ub-40k, 20.6 dec/s at c32, Banking77 0.961 held out.
    command: >-
      -m /models/Clef-Flash-Q4_K_M.gguf
      --host 0.0.0.0 --port 8080
      -c ${CLEF_CTX:-32768}
      -ngl 99
      -b ${CLEF_BATCH:-32768}
      -ub ${CLEF_UBATCH:-4096}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - e-core

networks:
  e-core:
    external: true
